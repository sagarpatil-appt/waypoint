[project]
name = "waypoint"
version = "0.1.0"
description = "MCP server that routes tickets through to shipped code — Jira today, more platforms later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0,<3.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
waypoint = "waypoint_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
